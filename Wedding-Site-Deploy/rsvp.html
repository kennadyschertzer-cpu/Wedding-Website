<div class="page-header">
  <span class="kicker">Kindly Respond</span>
  <h1>RSVP</h1>
  <span class="divider-mark"></span>
</div>

<main class="wrap">
  <!--
    ============================================================
    HOW THIS WORKS — Netlify Forms
    ============================================================
    This form uses Netlify's built-in form handling — no external
    service, API key, or backend code needed. Netlify automatically
    detects any form with data-netlify="true" during deploy and
    starts collecting submissions.

    WHERE RESPONSES SHOW UP:
      Netlify dashboard → your site → Forms → "rsvp"
      From there you can export everything as a CSV, which opens
      directly in Excel.

    TO ADD/REMOVE A QUESTION:
      Copy or delete a <div class="form-group">...</div> block below.
      Just make sure every input/select/textarea has a unique "name"
      attribute — that's what becomes the column header in your export.

    TO CHANGE WHERE PEOPLE LAND AFTER SUBMITTING:
      Edit the message inside thank-you.html.
    ============================================================
  -->
  <form
    name="rsvp"
    method="POST"
    action="/thank-you.html"
    data-netlify="true"
    data-netlify-honeypot="bot-field"
    class="rsvp-form"
  >
    <input type="hidden" name="form-name" value="rsvp">
    <p class="hidden-field">
      <label>Don't fill this out if you're human: <input name="bot-field"></label>
    </p>

    <div class="form-group">
      <label for="full-name">Full Name</label>
      <input type="text" id="full-name" name="Full Name" required>
    </div>

    <div class="form-group">
      <label>Will You Be Attending?</label>
      <div class="radio-row">
        <label class="radio-option">
          <input type="radio" name="Attending" value="Joyfully Accepts" required>
          Joyfully Accepts
        </label>
        <label class="radio-option">
          <input type="radio" name="Attending" value="Regretfully Declines" required>
          Regretfully Declines
        </label>
      </div>
    </div>

    <div class="form-group">
      <label for="guest-count">Number of Guests (including yourself)</label>
      <input type="number" id="guest-count" name="Number of Guests" min="1" max="10" value="1">
    </div>

    <div class="form-group">
      <label for="meal">Meal Preference</label>
      <select id="meal" name="Meal Preference">
        <option value="Chicken">Chicken</option>
        <option value="Beef">Beef</option>
        <option value="Vegetarian">Vegetarian</option>
        <option value="Other / Dietary Restriction">Other / Dietary Restriction</option>
      </select>
    </div>

    <div class="form-group">
      <label for="notes">Notes (song requests, dietary restrictions, etc.)</label>
      <textarea id="notes" name="Notes" rows="4"></textarea>
    </div>

    <button type="submit">Submit RSVP</button>
  </form>
</main>

<footer>
  <div class="names-small">Kennady &amp; Noah</div>
  <div class="fine">October 9, 2027 &nbsp;·&nbsp; Columbia, Illinois</div>
</footer>

</body>
